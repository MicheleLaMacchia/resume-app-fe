<div class="working-container">
  <mat-card>
    <mat-card-header>
      <button mat-icon-button class="back-btn" (click)="onBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <mat-card-title>Esperienze lavorative</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="isLoading">Caricamento...</div>
      <div *ngIf="!isLoading">
        <div class="cards">
          <mat-card *ngFor="let exp of working; let i = index" class="exp-card">
            <mat-card-header>
              <mat-card-title>Esperienza {{ i + 1 }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <div class="grid">
                <mat-form-field appearance="outline">
                  <mat-label>Azienda</mat-label>
                  <input matInput name="azienda-{{i}}" [(ngModel)]="exp.azienda" [disabled]="!editing[i]" />
                </mat-form-field>
                <mat-form-field appearance="outline">
                  <mat-label>Ruolo</mat-label>
                  <input matInput name="ruolo-{{i}}" [(ngModel)]="exp.ruolo" [disabled]="!editing[i]" />
                </mat-form-field>

                <mat-form-field appearance="outline">
                  <mat-label>Data inizio</mat-label>
                  <input matInput name="dataInizio-{{i}}" [(ngModel)]="exp.dataInizio" [disabled]="!editing[i]" />
                </mat-form-field>
                <mat-form-field appearance="outline">
                  <mat-label>Data fine</mat-label>
                  <input matInput name="dataFine-{{i}}" [(ngModel)]="exp.dataFine" [disabled]="!editing[i]" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full">
                  <mat-label>Descrizione</mat-label>
                  <textarea matInput name="descrizione-{{i}}" [(ngModel)]="exp.descrizione" [disabled]="!editing[i]"></textarea>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full">
                  <mat-label>Altro</mat-label>
                  <input matInput name="altro-{{i}}" [(ngModel)]="exp.altro" [disabled]="!editing[i]" />
                </mat-form-field>
              </div>
            </mat-card-content>
            <mat-card-actions>
              <button mat-stroked-button type="button" (click)="toggleEdit(i)">modifica</button>
              <button mat-stroked-button type="button" color="warn" (click)="deleteItem(i)" [disabled]="working.length <= 1">elimina</button>
            </mat-card-actions>
          </mat-card>
        </div>

        <div class="actions">
          <button mat-stroked-button type="button" (click)="addNew()">aggiungi</button>
          <button mat-stroked-button type="button" (click)="onReset()">reset</button>
          <button mat-raised-button color="primary" type="button" (click)="onSave()">salva</button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
