<div class="resume-list-container">
  <div class="header">
    <h1>Elenco Curriculum</h1>
    <button mat-raised-button color="primary" [routerLink]="['/resumes/new']">
      <mat-icon>add</mat-icon>
      Nuovo Curriculum
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div *ngIf="isLoading; else resumeTable" class="loading-container">
        <mat-spinner></mat-spinner>
        <p>Caricamento in corso...</p>
      </div>

      <ng-template #resumeTable>
        <div class="table-container" *ngIf="dataSource.length > 0; else noResumes">
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">
            <!-- Nome Column -->
            <ng-container matColumnDef="nome">
              <th mat-header-cell *matHeaderCellDef> Nome </th>
              <td mat-cell *matCellDef="let element"> {{element.datiGenerali.nome}} </td>
            </ng-container>

            <!-- Cognome Column -->
            <ng-container matColumnDef="cognome">
              <th mat-header-cell *matHeaderCellDef> Cognome </th>
              <td mat-cell *matCellDef="let element"> {{element.datiGenerali.cognome}} </td>
            </ng-container>

            <!-- Email Column -->
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef> Email </th>
              <td mat-cell *matCellDef="let element"> {{element.datiGenerali.email}} </td>
            </ng-container>

            <!-- Telefono Column -->
            <ng-container matColumnDef="telefono">
              <th mat-header-cell *matHeaderCellDef> Telefono </th>
              <td mat-cell *matCellDef="let element"> {{element.datiGenerali.telefono}} </td>
            </ng-container>

            <!-- Azioni Column -->
            <ng-container matColumnDef="azioni">
              <th mat-header-cell *matHeaderCellDef style="text-align: right;"> Azioni </th>
              <td mat-cell *matCellDef="let element" style="text-align: right;">
                <button mat-icon-button color="primary" [routerLink]="['/resumes/edit', element.id]" matTooltip="Modifica">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteResume(element.id!)" matTooltip="Elimina">
                  <mat-icon>delete</mat-icon>
                </button>
                <button mat-icon-button color="accent" [routerLink]="['/resumes', element.id]" matTooltip="Visualizza">
                  <mat-icon>visibility</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>

        <ng-template #noResumes>
          <div class="no-resumes">
            <mat-icon>folder_open</mat-icon>
            <p>Nessun curriculum trovato</p>
            <button mat-raised-button color="primary" [routerLink]="['/resumes/new']">
              <mat-icon>add</mat-icon>
              Crea il tuo primo curriculum
            </button>
          </div>
        </ng-template>
      </ng-template>
    </mat-card-content>
  </mat-card>
</div>
