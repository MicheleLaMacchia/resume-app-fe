<div class="education-container form-container">
  <button mat-icon-button class="back-btn" (click)="onBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <mat-card>
    <mat-card-header>
      <mat-card-title>Istruzione e formazione</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="isLoading">Caricamento...</div>
      <div *ngIf="!isLoading">
        <div class="cards">
          <mat-card *ngFor="let it of items; let i = index" class="item-card">
            <mat-card-header>
              <mat-card-title>Istruzione/Formazione {{ i + 1 }}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <div class="grid">
                <mat-form-field appearance="outline">
                  <mat-label>Ente rilascio</mat-label>
                  <input matInput name="ente-{{i}}" [(ngModel)]="it.enteRilascio" [disabled]="!editing[i]" />
                </mat-form-field>
                <mat-form-field appearance="outline">
                  <mat-label>Titolo</mat-label>
                  <input matInput name="titolo-{{i}}" [(ngModel)]="it.titolo" [disabled]="!editing[i]" />
                </mat-form-field>

                <mat-form-field appearance="outline">
                  <mat-label>Data inizio</mat-label>
                  <input matInput [matDatepicker]="startPicker" name="dataInizio-{{i}}" [(ngModel)]="it.dataInizio" [disabled]="!editing[i]" />
                  <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
                  <mat-datepicker #startPicker></mat-datepicker>
                </mat-form-field>
                <mat-form-field appearance="outline">
                  <mat-label>Data fine</mat-label>
                  <input matInput [matDatepicker]="endPicker" name="dataFine-{{i}}" [(ngModel)]="it.dataFine" [disabled]="!editing[i]" />
                  <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
                  <mat-datepicker #endPicker></mat-datepicker>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full">
                  <mat-label>Descrizione</mat-label>
                  <textarea matInput name="descr-{{i}}" [(ngModel)]="it.descrizione" [disabled]="!editing[i]" rows="3"></textarea>
                </mat-form-field>
              </div>
            </mat-card-content>
            <mat-card-actions>
              <button mat-stroked-button class="edit-btn" type="button" (click)="toggleEdit(i)">modifica</button>
              <button mat-stroked-button class="delete-btn" type="button" (click)="deleteItem(i)" [disabled]="items.length <= 1">elimina</button>
            </mat-card-actions>
          </mat-card>
        </div>

      </div>
    </mat-card-content>
  </mat-card>

  <div class="global-actions">
    <button mat-stroked-button class="global-add" type="button" (click)="addNew()">aggiungi</button>
    <button mat-stroked-button class="global-reset" type="button" (click)="onReset()">reset</button>
    <button mat-raised-button class="global-save" type="button" (click)="onSave()">salva</button>
  </div>
</div>
