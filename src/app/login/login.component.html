<div class="login-page">
  <div class="content">
    <div class="login-root">
      <div class="card-header">
        <h2>Accesso</h2>
      </div>
      <div class="login-content">
        <form (ngSubmit)="login()" #f="ngForm" novalidate>
          <label for="cf">Codice Fiscale</label>
          <div class="input-wrap">
            <input id="cf" name="cf" [(ngModel)]="codiceFiscale" required placeholder="Inserisci codice fiscale" />
          </div>
          <div class="actions">
            <button type="submit" [disabled]="!codiceFiscale || codiceFiscale.trim().length === 0">Entra</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
